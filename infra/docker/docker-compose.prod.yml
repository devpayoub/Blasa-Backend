# Production topology. Run with:
#   docker compose -f infra/docker/docker-compose.yml \
#     -f infra/docker/docker-compose.prod.yml up -d
# Requires the API image built (docker compose build api). No code volume
# mounts: the image ships the code with requirements/prod.txt installed.

services:
  api:
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py collectstatic --noinput &&
             gunicorn config.asgi:application
                      -k uvicorn.workers.UvicornWorker
                      -b 0.0.0.0:8000 --workers 4"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes: []

  ws:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    env_file: ../../.env
    command: daphne -b 0.0.0.0 -p 8000 --proxy-headers config.asgi:application
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"

  worker:
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes: []

  beat:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes: []
