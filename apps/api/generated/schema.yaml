components:
  schemas:
    ActionEnum:
      enum:
      - cancel
      - complete
      type: string
      description: |-
        * `cancel` - cancel
        * `complete` - complete
    AtmosphereEnum:
      enum:
      - MUSIC
      - CONVERSATION
      - QUIET
      type: string
      description: |-
        * `MUSIC` - Music on
        * `CONVERSATION` - Happy to chat
        * `QUIET` - Quiet ride
    AuditEntry:
      type: object
      description: 'A staff decision, safe to return to staff: actor identity, object
        and decision only.'
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
        object_type:
          type: string
        object_id:
          type: string
        reason:
          type: string
        metadata: {}
        created_at:
          type: string
          format: date-time
        actor_display_name:
          type: string
          readOnly: true
      required:
      - action
      - actor_display_name
      - created_at
      - id
      - metadata
      - object_id
      - object_type
      - reason
    AvatarConfirm:
      type: object
      properties:
        upload_token:
          type: string
          maxLength: 2048
      required:
      - upload_token
    AvatarDownload:
      type: object
      properties:
        download_url:
          type: string
          format: uri
        expires_in:
          type: integer
      required:
      - download_url
      - expires_in
    AvatarUploadRequest:
      type: object
      properties:
        file_name:
          type: string
          maxLength: 255
        content_type:
          $ref: '#/components/schemas/AvatarUploadRequestContentTypeEnum'
        size_bytes:
          type: integer
          maximum: 5242880
          minimum: 1
      required:
      - content_type
      - file_name
      - size_bytes
    AvatarUploadRequestContentTypeEnum:
      enum:
      - image/jpeg
      - image/png
      type: string
      description: |-
        * `image/jpeg` - image/jpeg
        * `image/png` - image/png
    AvatarUploadResponse:
      type: object
      properties:
        upload_url:
          type: string
          format: uri
        upload_token:
          type: string
      required:
      - upload_token
      - upload_url
    BlankEnum:
      enum:
      - ''
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ride:
          type: string
          format: uuid
        passenger:
          type: string
          format: uuid
          readOnly: true
        seats:
          type: integer
          maximum: 32767
          minimum: 0
        pickup_point:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: float
              example:
              - 12.9721
              - 77.5933
              minItems: 2
              maxItems: 3
        dropoff_point:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: float
              example:
              - 12.9721
              - 77.5933
              minItems: 2
              maxItems: 3
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        fare_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
        subsidy_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
        voucher_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
        paid_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
        refunded_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
        passenger_summary:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
      required:
      - dropoff_point
      - fare_amount
      - id
      - paid_amount
      - passenger
      - passenger_summary
      - pickup_point
      - refunded_amount
      - ride
      - status
      - subsidy_amount
      - voucher_amount
    BookingStatusEnum:
      enum:
      - REQUESTED
      - ACCEPTED
      - CONFIRMED
      - COMPLETED
      - REJECTED
      - CANCELLED_BY_PASSENGER
      - CANCELLED_BY_DRIVER
      - NO_SHOW
      type: string
      description: |-
        * `REQUESTED` - Requested
        * `ACCEPTED` - Accepted
        * `CONFIRMED` - Confirmed
        * `COMPLETED` - Completed
        * `REJECTED` - Rejected
        * `CANCELLED_BY_PASSENGER` - Cancelled by passenger
        * `CANCELLED_BY_DRIVER` - Cancelled by driver
        * `NO_SHOW` - No show
    Brand:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        owner:
          type: string
          format: uuid
          readOnly: true
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        logo_key:
          type: string
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - owner
    Campaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        brand:
          type: string
          format: uuid
        brand_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 120
        discount_per_seat:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        spent:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
          readOnly: true
        starts_at:
          type: string
          format: date-time
          nullable: true
        ends_at:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
        paused_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        audience_interests:
          type: array
          items:
            type: string
          description: Interest slugs this offer targets. Empty targets every member.
        promotion_title:
          type: string
          maxLength: 120
        promotion_body:
          type: string
          maxLength: 300
        promotion_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - balance
      - brand
      - brand_name
      - budget
      - created_at
      - discount_per_seat
      - id
      - name
      - paused_at
      - spent
    CampaignAnalytics:
      type: object
      properties:
        campaign:
          type: string
          format: uuid
        impressions:
          type: integer
        engagements:
          type: integer
        redemptions:
          type: integer
        promo_codes_issued:
          type: integer
        subsidy_spend:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        promo_redemption_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        promo_value_outstanding:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        budget:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        budget_remaining:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        audience_tags:
          type: integer
      required:
      - audience_tags
      - balance
      - budget
      - budget_remaining
      - campaign
      - engagements
      - impressions
      - promo_codes_issued
      - promo_redemption_value
      - promo_value_outstanding
      - redemptions
      - subsidy_spend
    CampaignEventInput:
      type: object
      description: Client-reported visibility only. The dedupe key and the ride come
        from the URL.
      properties:
        kind:
          $ref: '#/components/schemas/CampaignEventInputKindEnum'
      required:
      - kind
    CampaignEventInputKindEnum:
      enum:
      - IMPRESSION
      - ENGAGEMENT
      type: string
      description: |-
        * `IMPRESSION` - IMPRESSION
        * `ENGAGEMENT` - ENGAGEMENT
    CampaignFund:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        idempotency_key:
          type: string
          maxLength: 60
      required:
      - amount
    CancellationQuote:
      type: object
      properties:
        action:
          type: string
        allowed:
          type: boolean
        status:
          type: string
        refund:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
        subsidy_returned:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
        voucher_returned:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
        seats_released:
          type: integer
      required:
      - action
      - allowed
      - refund
      - seats_released
      - status
      - subsidy_returned
      - voucher_returned
    ChannelEnum:
      enum:
      - EMAIL
      - PHONE
      type: string
      description: |-
        * `EMAIL` - EMAIL
        * `PHONE` - PHONE
    CompleteRegistration:
      type: object
      description: Name, password and role collected after the contact proof succeeds.
      properties:
        full_name:
          type: string
          maxLength: 150
          minLength: 2
        password:
          type: string
          writeOnly: true
          maxLength: 128
        role:
          $ref: '#/components/schemas/CompleteRegistrationRoleEnum'
      required:
      - full_name
      - password
      - role
    CompleteRegistrationRoleEnum:
      enum:
      - PASSENGER
      - DRIVER
      type: string
      description: |-
        * `PASSENGER` - PASSENGER
        * `DRIVER` - DRIVER
    ContactCheck:
      type: object
      description: One field for either an email address or a Tunisian phone number.
      properties:
        contact:
          type: string
          maxLength: 254
      required:
      - contact
    ContactCheckResult:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/ChannelEnum'
        exists:
          type: boolean
        has_password:
          type: boolean
      required:
      - channel
      - exists
      - has_password
    ContactRequest:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/ChannelEnum'
