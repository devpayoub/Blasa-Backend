        name: from_lat
        schema:
          type: number
      - in: query
        name: from_lng
        schema:
          type: number
      - in: query
        name: from_radius_km
        schema:
          type: number
      - in: query
        name: max_price
        schema:
          type: number
      - in: query
        name: min_seats
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - departure
          - pickup
          - price
        description: |-
          * `departure` - departure
          * `price` - price
          * `pickup` - pickup
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - bookable
          - joined
          - mine
        description: 'bookable (default): open future rides; mine: rides you drive;
          joined: rides you booked'
      - in: query
        name: shared_interests
        schema:
          type: boolean
        description: 'true: only drivers who share at least one of your interests'
      - in: query
        name: to_lat
        schema:
          type: number
      - in: query
        name: to_lng
        schema:
          type: number
      - in: query
        name: to_radius_km
        schema:
          type: number
      - in: query
        name: when
        schema:
          type: string
          enum:
          - active
          - cancelled
          - completed
          - upcoming
        description: |-
          * `upcoming` - upcoming
          * `active` - active
          * `completed` - completed
          * `cancelled` - cancelled
      tags:
      - rides
      security:
      - jwtAuth: []
      responses:
