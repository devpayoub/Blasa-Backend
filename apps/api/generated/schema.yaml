      - email
      - email_verified_at
      - id
      - is_verified
      - onboarding_complete
      - phone_number
      - phone_verified_at
      - role
    UserPublicProfile:
      type: object
      description: Participant-facing profile. Deliberately has no contact, document
        or wallet fields.
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        bio:
          type: string
        member_since:
          type: string
          format: date-time
        is_driver:
          type: boolean
        average_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        review_count:
          type: integer
        completed_trips:
          type: integer
        shared_interests:
          type: array
          items:
            type: string
            pattern: ^[-a-zA-Z0-9_]+$
        reviews_visible:
          type: boolean
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/UserPublicReview'
        is_self:
          type: boolean
      required:
      - average_rating
      - bio
      - completed_trips
      - display_name
      - id
      - is_driver
      - is_self
      - member_since
      - review_count
      - reviews
      - reviews_visible
      - shared_interests
    UserPublicReview:
      type: object
      properties:
        score:
          type: integer
        comment:
          type: string
        created_at:
          type: string
          format: date-time
        rater_display_name:
          type: string
      required:
      - comment
      - created_at
      - rater_display_name
      - score
    UserRoleEnum:
      enum:
      - PASSENGER
      - DRIVER
      - BRAND
      type: string
      description: |-
        * `PASSENGER` - Passenger
        * `DRIVER` - Driver
        * `BRAND` - Brand
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        average_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        completed_trips:
          type: integer
        shared_interests:
          type: array
          items:
            type: string
            pattern: ^[-a-zA-Z0-9_]+$
          description: Interest slugs this member shares with you; empty for yourself
      required:
      - average_rating
      - completed_trips
      - display_name
      - id
      - shared_interests
    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        make:
          type: string
          maxLength: 50
        model:
          type: string
          maxLength: 50
        color:
          type: string
          maxLength: 30
        plate_number:
          type: string
          maxLength: 20
        seats:
          type: integer
          maximum: 32767
          minimum: 0
        carte_grise:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
        is_verified:
          type: boolean
          description: A vehicle is verified only through an approved Carte Grise.
            Derived, never stored.
          readOnly: true
        is_bookable:
          type: boolean
          readOnly: true
      required:
      - id
      - is_bookable
      - is_verified
      - make
      - model
      - plate_number
      - seats
    VehicleSummary:
      type: object
      properties:
        make:
          type: string
          maxLength: 50
        model:
          type: string
          maxLength: 50
        color:
          type: string
          maxLength: 30
        seats:
          type: integer
          maximum: 32767
          minimum: 0
      required:
      - make
      - model
      - seats
    VerificationDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        doc_type:
          allOf:
          - $ref: '#/components/schemas/DocTypeEnum'
          readOnly: true
        content_type:
          type: string
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/VerificationDocumentStatusEnum'
          readOnly: true
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        rejection_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        history:
          type: array
          items:
            $ref: '#/components/schemas/VerificationReview'
          readOnly: true
      required:
      - content_type
      - created_at
      - doc_type
      - history
      - id
      - rejection_reason
      - reviewed_at
      - size_bytes
      - status
      - uploaded_at
    VerificationDocumentStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - NEEDS_MORE_DOCUMENTS
      - SUPERSEDED
      type: string
      description: |-
        * `PENDING` - Pending review
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `NEEDS_MORE_DOCUMENTS` - Needs more documents
        * `SUPERSEDED` - Superseded
    VerificationReview:
      type: object
      properties:
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        decision:
          allOf:
          - $ref: '#/components/schemas/VerificationReviewDecisionEnum'
          readOnly: true
        reason:
          type: string
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - decision
      - reason
      - timestamp
    VerificationReviewDecisionEnum:
      enum:
      - APPROVE
      - REJECT
      - REQUEST_MORE
      - SUPERSEDE
      - REVOKE
      type: string
      description: |-
        * `APPROVE` - Approve
        * `REJECT` - Reject
        * `REQUEST_MORE` - Request more documents
        * `SUPERSEDE` - Supersede
        * `REVOKE` - Revoke
    Voucher:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 40
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,7}(?:\.\d{0,3})?$
        expires_at:
          type: string
          format: date-time
          nullable: true
        redeemed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - code
      - created_at
      - id
    VoucherClaim:
      type: object
      properties:
        code:
          type: string
          maxLength: 40
      required:
      - code
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
