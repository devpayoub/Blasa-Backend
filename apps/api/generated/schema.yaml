          Matches rides with this atmosphere or none set

          * `MUSIC` - Music on
          * `CONVERSATION` - Happy to chat
          * `QUIET` - Quiet ride
      - in: query
        name: departure_after
        schema:
          type: string
          format: date-time
      - in: query
        name: departure_before
        schema:
          type: string
          format: date-time
