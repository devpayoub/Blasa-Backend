  /api/v1/bookings/{id}/transitions/{name}/:
    post:
      operationId: v1_bookings_transitions_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this booking.
        required: true
      - in: path
        name: name
        schema:
          type: string
          pattern: ^[a-z_]+$
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transition'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Transition'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Transition'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
