name: blasa

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: blasa
      POSTGRES_USER: blasa
      POSTGRES_PASSWORD: blasa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blasa -d blasa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    env_file: ../../.env
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/api:/app

  worker:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    env_file: ../../.env
    command: celery -A config worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/api:/app

  beat:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
    env_file: ../../.env
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/api:/app

volumes:
  pgdata:
    name: blasa_pgdata
